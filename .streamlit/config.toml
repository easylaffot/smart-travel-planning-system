[server]
headless = true
enableCORS = true
enableXsrfProtection = true
corsAllowedOrigins = [
    "https://smart-travel-planning-system-jwrk.onrender.com"
]
allowedHosts = [
    "smart-travel-planning-system-jwrk.onrender.com",
    "localhost",
    "127.0.0.1"
]

fileWatcherType = "none"
maxUploadSize = 10
[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#EAF0F8"
textColor = "#172033"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#0B1F3A"
secondaryBackgroundColor = "#132B4F"
textColor = "#F8FAFC"
primaryColor = "#38BDF8"
